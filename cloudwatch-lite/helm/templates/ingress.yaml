apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudwatch-lite-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: cloudwatch.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudwatch-lite-service
                port:
                  number: 3000
